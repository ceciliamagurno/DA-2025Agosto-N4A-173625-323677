
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tablero del Propietario</title>

  <link rel="stylesheet" href="styles.css">
  <script src="vistaWeb.js"></script>
</head>

<body>
  <script src="utilesVista.js"></script>

  <div class="container">

    <!-- HEADER -->
    <div class="top-row">
      <div class="flex items-center gap-12">
        <div class="logo-box"></div>

        <div>
          <div class="title">Tablero del propietario</div>
          <div class="menu-desc">Resumen y actividad</div>
        </div>
      </div>

      <div class="right-actions">
        <div>Bienvenido, <strong id="nombreMini">Propietario</strong></div>
        <div class="mt-1">
          <a href="login.html" class="btn ghost">Salir</a>
        </div>
      </div>
    </div>


    <!-- LAYOUT PRINCIPAL -->
    <div class="grid-layout">

      <main>

        <!-- RESUMEN SUPERIOR -->
        
        <div class="resumen-row">

          <div class="res-box res-box-horizontal">
            <span class="small-muted">NOMBRE COMPLETO</span>
            <span id="nombreProp" class="res-value"></span>
          </div>

          <div class="res-box res-box-horizontal">
            <span class="small-muted">ESTADO</span>
            <span id="estadoProp" class="res-value"></span>
          </div>

          <div class="res-box res-box-horizontal">
            <span class="small-muted">SALDO ACTUAL</span>
            <span id="saldoProp" class="res-value"></span>
          </div>

        </div>

        
          <div class="card">
          <!-- VEHÍCULOS Y BONIFICACIONES -->
          

          <div class="card">
              <div class="panel-title">
                <h3>Vehículos registrados</h3>
              </div>
              <div id="vehiculosDiv"></div>
          </div>


          <div class="card">
            <div class="panel-title">
              <h3>Bonificaciones asignadas</h3>
            </div>
            <div id="bonificacionesDiv"></div>
          </div>

          
          </div>


          <!-- TRÁNSITOS -->
          <div class="card width-320 mt-1">
            <div class="panel-title">
              <h3>Historial de tránsitos</h3>
            </div>

            <div id="transitosDiv"></div>
          </div>

        </div>


        <!-- NOTIFICACIONES -->
        <div class="card mt-1">

          <div class="panel-title">
            <strong>Notificaciones del sistema</strong>
            <button class="btn ghost" onclick="borrarNotificaciones()">Borrar</button>
          </div>

          <ul id="notificacionesList" class="notif-list"></ul>

        </div>

      </main>

    </div>
  </div>


  <script>

    urlIniciarVista = "/tablero/vistaConectada";
    parametrosIniciovista = "";

    
    function mostrar_usuarioNoAutenticado(urlDestino){
        window.location.href = urlDestino;
    }

    async function mostrar_mensaje(texto) {
        await mostrarMensaje(texto);
    }

    async function excepcionDeAplicacion(mensaje) {
        await mostrarMensaje(mensaje);
    }

     function procesarErrorSubmit(status, text) {
        mostrarMensaje("Error (" + status + "): " + text);
    }

       function borrarNotificaciones() {
        document.getElementById("notificacionesList").innerHTML = "";
    }

    //renderizar la vista al cargar la página
    function mostrar_tableroPropietario(dto) {
      console.log("DTO recibido:", dto);
        

      document.getElementById("nombreMini").textContent = dto.nombreCompleto;
      document.getElementById("nombreProp").textContent = dto.nombreCompleto;
      document.getElementById("estadoProp").textContent = dto.estado;
      document.getElementById("saldoProp").textContent = dto.saldoActual;

      document.getElementById("vehiculosDiv").innerHTML = crearTablaDesdeJson(dto.vehiculos || []);

      document.getElementById("bonificacionesDiv").innerHTML = crearTablaDesdeJson(dto.bonificaciones || []);
      
      document.getElementById("transitosDiv").innerHTML = crearTablaDesdeJson(dto.transitos || []);

      const ul = document.getElementById("notificacionesList");
      ul.innerHTML = "";

      if (dto.notificaciones) {
        for (const n of dto.notificaciones) {
          const li = document.createElement("li");
          li.textContent = n.mensaje;
          ul.appendChild(li);
        }
      }

      document.getElementById("vehiculosDiv").innerHTML =
          crearTablaDesdeJson(dto.vehiculos);

      document.getElementById("bonificacionesDiv").innerHTML =
          crearTablaDesdeJson(dto.bonificaciones);

      document.getElementById("transitosDiv").innerHTML =
          crearTablaDesdeJson(dto.transitos || []);

    }




  </script>

</body>
</html>
