

    <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Emular tránsito</title>

  <link rel="stylesheet" href="styles.css">
  <script src="vistaWeb.js"></script>
  
</head>

<body>
  <script src="utilesVista.js"></script>

  <div class="container">

    <!-- HEADER -->
    <div class="top-row">
      <div class="flex items-center gap-12">
        <div class="logo-box"></div>
        <div>
          <div class="title">Emular tránsito</div>
          <div class="menu-desc">Administrador · Registro manual de tránsito</div>
        </div>
      </div>

      <div class="right-actions">
        <div>Bienvenido, <strong id="nombreMini">Administrador</strong></div>
        <div class="mt-1">
          <a href="admin.html" class="btn ghost">Volver</a>
          <a href="login.html" class="btn ghost">Salir</a>
        </div>
      </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <main>

      <!-- SELECCIÓN DE PUESTO + TARIFAS -->
      <div class="card">
        <div class="panel-title">
          <h3>Puesto y tarifas</h3>
        </div>

        <div class="flex gap-12 wrap">
          <div class="flex-col" style="min-width:260px;max-width:320px;">
            <label for="selectPuesto" class="small-muted">Puesto</label>
            <select id="selectPuesto" class="input-full" onchange="onCambioPuesto()">
                <option value="">Cargando puestos...</option>
            </select>
          </div>
        </div>

        <div class="mt-1">
          <h4 class="small-muted">Tarifas del puesto seleccionado</h4>
          <div id="tarifasDiv"></div>
        </div>
      </div>

      <!-- FORMULARIO DE EMULACIÓN -->
      <div class="card">
        <div class="panel-title">
          <h3>Datos del tránsito</h3>
        </div>

    <form id="formEmular" onsubmit="enviarEmulacion(event)">
        <!-- hidden que va al backend como nombrePuesto -->
        <input type="hidden" id="nombrePuestoHidden" name="nombrePuesto">

        <label>Matrícula</label>
        <input type="text" id="matricula" name="matricula">

        <label>Fecha y hora</label>
        <input type="datetime-local" id="fechaHoraString" name="fechaHoraString">

        <button type="submit" class="btn">Emular tránsito</button>
    </form>
    </div>

      <!-- RESULTADO -->
      <div class="card">
        <div class="panel-title">
          <h3>Resultado del tránsito</h3>
        </div>

        <div id="resultadoDiv">
          <p class="small-muted">Aún no se ha emulado ningún tránsito.</p>
        </div>
      </div>

    </main>

  </div>
    <script>
  // --- Configuración inicial ---
  urlIniciarVista = "/transitos/puestos";
  parametrosIniciovista = "";


  function mostrar_usuarioNoAutenticado(urlDestino) {
    window.location.href = urlDestino;
  }

  async function mostrar_mensaje(texto) {
    await mostrarMensaje(texto);
  }

  async function excepcionDeAplicacion(mensaje) {
    await mostrarMensaje(mensaje);
  }

  function procesarErrorSubmit(status, text) {
    mostrarMensaje("Error (" + status + "): " + text);
  }

  // Cargao puestos en el select al iniciar la vista
  
  function mostrar_puestos(puestos) {
    var select = document.getElementById("selectPuesto");
    if (!select) return;

    select.innerHTML = "";

    var optInicial = document.createElement("option");
    optInicial.value = "";
    optInicial.textContent = "Seleccione un puesto...";
    select.appendChild(optInicial);

    if (!puestos) return;

    for (var i = 0; i < puestos.length; i++) {
      var p = puestos[i];
      if (!p) continue;

      var opt = document.createElement("option");
      opt.value = p.nombre;       
      opt.textContent = p.nombre;
      select.appendChild(opt);
    }
  }

  // si cambio de puesto, cargar tarifas y actualizar hidden
  function onCambioPuesto() {
    var select = document.getElementById("selectPuesto");
    var nombreP = select.value;
    var tarifasDiv = document.getElementById("tarifasDiv");

    // actualizar el hidden del form
    var hidden = document.getElementById("nombrePuestoHidden");
    if (hidden) {
      hidden.value = nombreP;
    }

    if (!nombreP || nombreP.trim() === "") {
      if (tarifasDiv) {
        tarifasDiv.innerHTML = "";
      }
      return;
    }

    submit(
        "/transitos/tarifas",
        "nombrePuesto=" + encodeURIComponent(nombreP),
        "GET"
    );
  }

  function mostrar_tarifas(tarifas) {
    var tarifasDiv = document.getElementById("tarifasDiv");
    if (!tarifasDiv) return;

    tarifasDiv.innerHTML = crearTablaDesdeJson(tarifas || []);
  }

  // --- 3) Enviar emulación ---
  function enviarEmulacion(event) {
    event.preventDefault();

    var hidden = document.getElementById("nombrePuestoHidden");
    if (!hidden || !hidden.value) {
      mostrarMensaje("Debe seleccionar un puesto antes de emular el tránsito.");
      return;
    }

    var params = serializarFormulario("formEmular");
    submit("/transitos/emular", params);
  }

  // --- 4) Mostrar resultado ---

  function mostrar_resultado(dto) {
    var cont = document.getElementById("resultadoDiv");
    if (!cont) return;

    if (!dto) {
      cont.innerHTML =
        "<p class='small-muted'>No se recibió información del tránsito.</p>";
      return;
    }
    cont.innerHTML = crearTablaDesdeJson([dto]);
  }

</script>
</body>
</html>
